<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dial Code</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 380px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .code {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 20px 0 30px;
    }

    .dial-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .dial-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="title">Dial Code</div>

    <div class="code">*811*9372604#</div>

    <a class="dial-btn" href="tel:*811*9372604#">
      📞 DIAL CODE
    </a>

  </div>

</body>
</html>
